{% set name = "typechecks" %}
{% set version = "0.1.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 887e33437ea75d9e6997e8a64419c7f62a68f74ec4bdccd3304544fed35fa310

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - typechecks

about:
  home: https://github.com/openvax/typechecks
  license: Apache-2.0
  summary: 'Helper functions for runtime type checking'
  license_family: Apache
  license_file: LICENSE

extra:
  recipe-maintainers:
    - npavlovikj
